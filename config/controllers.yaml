controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["Revolute 1"]
    right_wheel_names: ["Revolute 2"]
    wheel_separation: 0.398
    wheel_radius: 0.0675
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    # robot_localization publishes the filtered odom -> base_link transform.
    enable_odom_tf: false
    position_feedback: true
    open_loop: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.4
        min_velocity: -0.4
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.8
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.5
